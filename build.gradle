plugins { id 'com.android.application'; id 'com.google.gms.google-services' }

android { namespace 'com.bahadurkhail.welfare'; compileSdk 35
    defaultConfig { applicationId 'com.bahadurkhail.welfare'; minSdk 23; targetSdk 35; versionCode 1; versionName '1.0.0' }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.12.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
}
